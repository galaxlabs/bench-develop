[build-system]
requires = ["hatchling>=1.22.0"]
build-backend = "hatchling.build"

[project]
name = "bench"
version = "0.0.1"
description = "Bench-like CLI (Orbit bench)"
readme = "README.md"
license = {text = "MIT"}
authors = [{name="Xperts Global", email="you@example.com"}]
requires-python = ">=3.10"
dependencies = [
click>=8.1", "jinja2>=3.1", "pyyaml>=6", "requests>=2.31", "rich>=13.9"]

[project.scripts]
bench = "bench.cli:main"
orbit = "bench.cli:main"